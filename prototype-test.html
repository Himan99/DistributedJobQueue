<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Prototype</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: 24px; background: #f8f9fa; }
    h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 24px; color: #1a1a2e; }
    .treemap { height: 300px; background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #666; font-size: 1rem; }
    .btn { margin-top: 16px; padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 500; cursor: pointer; }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <h1>Dashboard</h1>
  <div class="treemap">Treemap placeholder</div>
  <button class="btn" onclick="alert('Dispatch Jobs clicked')">Dispatch Jobs</button>
</body>
</html>
