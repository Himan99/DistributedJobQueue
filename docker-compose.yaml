services:
  postgres:
    image: postgres:18
    container_name: dist_job_queue
    restart: unless-stopped
    environment:
      POSTGRES_USER: job_queue_user
      POSTGRES_PASSWORD: job_queue_pass
      POSTGRES_DB: job_queue_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d

  fast-worker:
    build:
      context: .
      dockerfile: DistributedJobQueue.Worker/Dockerfile
    restart: unless-stopped
    environment:
      JobQueueDb__ConnectionString: "Host=postgres;Port=5432;Database=job_queue_db;Username=job_queue_user;Password=job_queue_pass"
      ALLOWED_TYPES: "email,sms"
      POOL_SIZE: "20"
      LEASE_SECONDS: "20"
      HEARTBEAT_INTERVAL: "5"
      POLL_INTERVAL: "2000"
    depends_on:
      - postgres
    deploy:
      replicas: 3

  batch-worker:
    build:
      context: .
      dockerfile: DistributedJobQueue.Worker/Dockerfile
    restart: unless-stopped
    environment:
      JobQueueDb__ConnectionString: "Host=postgres;Port=5432;Database=job_queue_db;Username=job_queue_user;Password=job_queue_pass"
      ALLOWED_TYPES: "report,ach"
      POOL_SIZE: "4"
      LEASE_SECONDS: "120"
      HEARTBEAT_INTERVAL: "30"
      POLL_INTERVAL: "5000"
    depends_on:
      - postgres
    deploy:
      replicas: 2

volumes:
  pgdata: