services:
  postgres:
    image: postgres:18
    container_name: dist_job_queue
    restart: unless-stopped
    environment:
      POSTGRES_USER: job_queue_user
      POSTGRES_PASSWORD: job_queue_pass
      POSTGRES_DB: job_queue_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d

volumes:
  pgdata: